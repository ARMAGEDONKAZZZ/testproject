name: Keep Render instance awake

# Render's free tier spins the service down after 15 minutes of no
# incoming requests (next request then pays a ~50s cold-start penalty).
# Pinging /healthz well under that window keeps it warm.
on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        run: curl -fsS --max-time 55 https://testproject-sz4h.onrender.com/healthz
