services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: neuratop
      POSTGRES_PASSWORD: neuratop
      POSTGRES_DB: neuratop
    ports:
      - "55432:5432"
    volumes:
      - neuratop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuratop -d neuratop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  neuratop_pgdata:
